<style>
:root{--bg:#eef1f4;--pn:#fff;--ink:#1b2a38;--mut:#5f6f7e;--ac:#0f5c6e;--ln:#d9e0e6}
*{box-sizing:border-box}

#dg{border:0;border-radius:12px;padding:20px;width:min(420px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}#dg::backdrop{background:rgba(20,30,40,.45)}#dg p{margin:0 0 12px}
#dg input{width:100%;margin-bottom:12px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px}.dgb{display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:8px}.btn.dng{background:#c53030;border-color:#c53030;color:#fff}

.empty{padding:40px;text-align:center;color:var(--mut)}
#tt{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff}
#tt:empty{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr;gap:10px;padding:12px}nav{flex-direction:row;max-height:none;border:0;border-radius:0;overflow-x:auto;overflow-y:hidden;position:sticky;top:var(--hh,60px);z-index:4;margin:0 -12px;padding:6px 12px;background:var(--bg)}nav button{white-space:nowrap;flex:none;gap:6px}.mr{flex:none}}
@media(max-width:600px){header{padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));gap:8px}header h1{font-size:17px}header input[type=search]{order:5;flex:1 1 100%;width:100%}.row{grid-template-columns:1fr}.row .st{text-align:left}#chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{flex:none;white-space:nowrap}#dr{width:100%;border-left:0}body.lock{overflow:hidden}.sp{margin-left:0;width:100%}.mp{right:auto;left:-140px}}
@media(pointer:coarse){nav .mx{width:36px;height:36px}.btn,.chip,nav button,.q button,button.lab,.seg button,.tb button{min-height:40px}}
@media(prefers-reduced-motion:no-preference){#dr{animation:in .18s ease-out}@keyframes in{from{transform:translateX(40px);opacity:0}}}
#mb{margin-bottom:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--pn)}#mb[hidden]{display:none}#mb.pend{border-color:#e0b252;background:#fff7e0}.mbh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.mbh label{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:14px}#mbx{display:block;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;resize:none;overflow:hidden;background:var(--pn);color:var(--ink)}.mt{flex:1;min-width:0}.np{display:block;max-width:180px;font-style:normal;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mk{margin-left:5px;font-size:12px}.mk.pend{color:#e0b252}nav .mx.pe{color:var(--ac)}nav .mx.pe:hover,nav .mx.pe:focus-visible{background:var(--ac);border-color:var(--ac);color:#fff}
</style>

<body>
<header>
  <h1>Meu cantinho 🌷</h1>
  <input type="search" id="q" placeholder="Buscar nome, anotação ou histórico">
  <button class="btn p" data-a="new">Novo contato</button>
  <details class="mn"><summary class="btn">Dados ▾</summary><div class="mp"><button class="btn" data-a="imp">Importar Trello ou backup</button><button class="btn" data-a="exp">Baixar backup completo (JSON)</button></div></details>
  <input type="file" id="fi" accept=".json,application/json" hidden>
</header>
<div class="app"><nav id="rail" aria-label="Mês"></nav><main><div id="bn" hidden></div><div id="mb" hidden></div><div id="lf"></div><div id="lp" hidden></div><div id="lg" hidden><div class="lgt"><input id="lgq" type="search" placeholder="Filtrar labels pelo nome"><button class="chip" data-a="lsu">Selecionar sem uso</button><button class="chip" data-a="lsa">Selecionar todas</button><button class="chip" data-a="lsx">Limpar seleção</button><button class="btn dng" id="lgd" data-a="lsd" disabled>Excluir selecionadas</button></div><div id="lgc"></div></div><div class="chips" id="chips"></div><div id="list"></div></main></div>
<aside id="dr" hidden aria-label="Detalhes do contato"></aside>
<dialog id="dg"><p id="dgm"></p><input id="dgi" hidden><div class="dgb"><button class="btn p" id="dgo" data-d="ok">OK</button><button class="btn dng" id="dga" data-d="alt" hidden></button><button class="btn" data-d="no">Cancelar</button></div></dialog>
<div id="tt" role="status" aria-live="polite"></div>
<script>
const S=[['triagem','Novo contato','#7b8794'],['docs','Cobrar documentos','#b7791f'],['guia','Guia a emitir/pagar','#2b6cb0'],['entrada','Dar entrada','#6b46c1'],['inss','Em análise','#0f766e'],['deferido','Deferido, a receber','#2f855a'],['fim','Finalizada','#4a5568'],['indef','Indeferido','#c53030']];
const SN=Object.fromEntries(S.map(s=>[s[0],s]));
const QK=['Enviou documentos','Faltando: ','Guia paga','Informou data: ','Retornou contato','Entrada feita','Sem resposta'];
const MN='janeiro fevereiro marco abril maio junho julho agosto setembro outubro novembro dezembro'.split(' ');
const ML=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const HEX={green:'#61bd4f',yellow:'#f2d600',orange:'#ff9f1a',red:'#eb5a46',purple:'#c377e0',blue:'#0079bf',sky:'#00c2e0',lime:'#51e898',pink:'#ff78cb',black:'#344563'};
const KEY='sm_atendimentos_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const now=()=>new Date().toISOString();
const up=s=>String(s??'').toLocaleUpperCase('pt-BR'),toHtml=t=>esc(t).replace(/\r?\n/g,'<br>'),plain=h=>String(h||'').replace(/<[^>]+>/g,' ');
const okd=v=>!v||/^20\d\d-/.test(v);
const fx=s=>s?s.split('-').reverse().join('/'):'';
const txt=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<li>/gi,'• ').replace(/<\/(li|p|div)>|<br\s*\/?>/gi,'\n');return d.textContent.trim()};
function clean(h){const t=document.createElement('template');t.innerHTML=h;const ok=/^(B|STRONG|I|EM|U|S|STRIKE|UL|OL|LI|BR|DIV|P)$/;
 (function w(n){[...n.childNodes].forEach(k=>{if(k.nodeType===1){w(k);if(!ok.test(k.tagName))k.replaceWith(...k.childNodes);else[...k.attributes].forEach(a=>k.removeAttribute(a.name))}else if(k.nodeType!==3)k.remove()})})(t.content);return t.innerHTML}
const hs=c=>c.hist.map((h,i)=>({h,i})).sort((a,b)=>(b.h.d?Date.parse(b.h.d):-1)-(a.h.d?Date.parse(a.h.d):-1)||a.i-b.i);
const mlabel=k=>k?ML[+k.slice(5)-1]+' de '+k.slice(0,4):'Sem data';
const mkey=t=>{const m=norm(t).match(/(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro).*?(\d{4})/);return m?m[2]+'-'+String(MN.indexOf(m[1])+1).padStart(2,'0'):''};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{cards:{},labels:{}};db.meses=db.meses||[];db.mnotes=db.mnotes||{};db.gone=db.gone||[];db.del=db.del||[];
let st={mes:'*',et:'ativos',q:'',lb:[],mode:'e',lopen:false,sort:'etapa',ls:[],lq:'',lm:false,lg:false,mm:false,open:null};
let cur=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não foi possível salvar: '+e.message)}}
let tm;function toast(m){$('#tt').textContent=m;clearTimeout(tm);tm=setTimeout(()=>$('#tt').textContent='',5000)}
function ls(n){const [b,v]=(db.labels[n]||'black').split('_');const lt=v==='light',dk=v==='dark',h=HEX[b]||HEX.black;
 return `background:color-mix(in srgb,${h} ${dk?'65%,#000':lt?'55%,#fff':'100%,#000'});color:${lt||['yellow','lime','sky'].includes(b)?'#1b2a38':'#fff'}`}
const TRASH='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';
const tchip=(l,n,sel)=>`<span class="lab mg${sel?' sel':''}" ${sel===undefined?'':`role="checkbox" aria-checked="${sel}" tabindex="0" data-a="lsel" data-l="${esc(l)}"`} style="${ls(l)}">${sel?'✓ ':''}${esc(l)}${n==null?'':' <small>'+n+'</small>'}<button class="tx" data-a="dl" data-l="${esc(l)}" aria-label="Excluir label ${esc(l)}" title="Excluir label">${TRASH}</button></span>`;
let _a=null;
function ask(msg,o={}){return new Promise(res=>{const d=$('#dg'),i=$('#dgi'),b=$('#dgo');$('#dgm').textContent=msg;i.hidden=!o.input;i.value='';i.placeholder=o.ph||'';
 b.textContent=o.ok||'OK';b.className='btn '+(o.danger?'dng':'p');const a=$('#dga');a.hidden=!o.alt;a.textContent=o.alt||'';
 _a=ok=>{_a=null;try{d.close()}catch(e){}d.removeAttribute('open');res(ok==='alt'?'alt':ok?(o.input?i.value.trim():true):null)};
 try{d.showModal()}catch(e){d.setAttribute('open','')}if(o.input)i.focus()})}
const lt=c=>Math.max(0,...c.hist.map(h=>h.d?Date.parse(h.d):0)),si=c=>S.findIndex(s=>s[0]===c.etapa),nm=(a,b)=>a.nome.localeCompare(b.nome,'pt'),dk=v=>v||'9999';
const SORT={etapa:(a,b)=>si(a)-si(b)||nm(a,b),nome:nm,parto:(a,b)=>dk(a.parto).localeCompare(dk(b.parto))||nm(a,b),ativ:(a,b)=>lt(b)-lt(a)||nm(a,b)};
const labs=a=>a.map(l=>`<span class="lab" style="${ls(l)}">${esc(l)}</span>`).join('');
const fd=(iso,o)=>iso?new Date(iso).toLocaleString('pt-BR',o?{day:'2-digit',month:'2-digit',year:'2-digit'}:{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'Pré-carga do Trello';
const fs=s=>s?s.split('-').reverse().map((x,i)=>i==2?x.slice(2):x).join('/'):'';

// ---------- Importação do Trello ----------
function parseName(raw){
 const m=raw.match(/^(.*?)\s*(?:[-—–]\s+|\s[-—–]\s*|\()(.*)$/);
 const nome=up((m?m[1]:raw).trim()),extra=m?m[2].replace(/\)\s*$/,'').trim():'';
 const sq=extra.match(/saque dia (\d{1,2})\/(\d{1,2})/i);let saque='';
 if(sq){const t=Date.now();saque=[-1,0,1].map(o=>new Date(new Date().getFullYear()+o,+sq[2]-1,+sq[1])).sort((a,b)=>Math.abs(a-t)-Math.abs(b-t))[0].toLocaleDateString('sv')}
 return{nome,extra,saque}}
function stage(lab,ln){const h=x=>lab.some(l=>norm(l).includes(x)),n=norm(ln);
 return h('finalizada')?'fim':h('indeferi')&&!h('deferido')?'indef':h('deferido')?'deferido':h('entrada ok')?'inss':h('guia paga')?'entrada':h('guia emitida')||h('guia agendada')?'guia':n.includes('aguardando deferimento')?'inss':n.startsWith('indeferidos')?'indef':n.startsWith('deferidos')?'deferido':n.includes('dar entrada')?'entrada':'triagem'}
function importTrello(j){
 const L={};j.lists.forEach(l=>L[l.id]=l.name);
 (j.labels||[]).forEach(l=>{if(l.name&&!db.gone.includes(l.name)&&!db.labels[l.name])db.labels[l.name]=l.color});
 let n=0,u=0,k=0;
 for(const c of j.cards){
  const ln=L[c.idList]||'';if(/introdu/i.test(ln)||db.del.includes(c.id))continue;
  const lab=(c.labels||[]).map(l=>l.name).filter(x=>x&&!db.gone.includes(x)),ex=db.cards[c.id];
  if(ex){k++;let ch=0;const nl=lab.filter(x=>!ex.tl.includes(x));
   if(nl.length){ex.labels=[...new Set([...ex.labels,...nl])];ch=1}ex.tl=lab;
   if(c.desc&&c.desc!==ex.td){ex.td=c.desc;ex.hist.unshift({d:now(),t:'Anotação atualizada no Trello: '+c.desc});ch=1}
   u+=ch;continue}
  const p=parseName(c.name),mes=mkey(ln),hist=[];
  if(p.extra)hist.push({d:null,t:p.extra});
  if(!mes&&ln)hist.push({d:null,t:'Lista no Trello: '+ln});
  db.cards[c.id]={id:c.id,nome:p.nome,mes,etapa:stage(lab,ln),labels:lab,tl:lab,obs:toHtml(c.desc||''),rich:1,td:c.desc||'',saque:p.saque,parto:'',hist,arq:!!c.closed};n++}
 save();toast(`Importação concluída: ${n} novos adicionados; ${k} já existiam e foram mantidos${u?` (${u} com novidades do Trello acrescentadas, sem sobrescrever)`:''}.`)}
function mergeBackup(j){let n=0,k=0;
 Object.values(j.cards||{}).forEach(c=>{if(db.cards[c.id]){k++;return}if(db.del.includes(c.id))return;c.labels=(c.labels||[]).filter(l=>!db.gone.includes(l));db.cards[c.id]=c;n++});
 Object.entries(j.labels||{}).forEach(([l,v])=>{if(!db.labels[l]&&!db.gone.includes(l))db.labels[l]=v});
 (j.meses||[]).forEach(m=>{if(!db.meses.includes(m))db.meses.push(m)});
 Object.entries(j.mnotes||{}).forEach(([m,v])=>{if(!db.mnotes[m])db.mnotes[m]=v});

document.addEventListener('paste',e=>{if(inEd(e)){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
$('#dg').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b&&_a)_a(b.dataset.d==='ok'?true:b.dataset.d==='alt'?'alt':false)});
$('#dg').addEventListener('cancel',e=>{e.preventDefault();if(_a)_a(false)});
$('#dg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dgi'){e.preventDefault();if(_a)_a(true)}});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
all().forEach(c=>{c.nome=up(c.nome);if(!c.rich){c.obs=toHtml(c.obs);c.rich=1}});save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px')).observe($('header'));
render();
</script>
</body>
</html>
