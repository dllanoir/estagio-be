name: CI Build & Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f dist/login.html || { echo "Missing dist/login.html"; exit 1; }
          test -f dist/index.supabase.html || { echo "Missing dist/index.supabase.html"; exit 1; }
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "All distribution artifacts validated successfully!"
